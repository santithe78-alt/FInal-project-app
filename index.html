<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">        
        <!-- Category and Score -->
        <div class="score-area">
            <p>Category:Movies <span id="category"></span></p>
            <p>Score: <span id="score">0</span></p>
        </div>
        <!-- Hangman Drawing Area -->
        <div id="hangman-area">            
            <img src="bodyImages/gallows.png" id="gallows">
            <img src="bodyImages/head.png" id="head">
            <img src="bodyImages/torse.png" id="torse">
            <img src="bodyImages/leftArm.png" id="leftArm">
            <img src="bodyImages/rightArm.png" id="rightArm">
            <img src="bodyImages/leftLeg.png" id="leftLeg">
            <img src="bodyImages/rightLeg.png" id="rightLeg">     
        </div>

        <!-- Word Display (blanks) -->
        <div id="word-display">
        
        </div>  
        
        <!-- Letter Keyboard -->
        <div id="keyboard">
            <div>
                <button id="Q" onclick="keyClick(event)">Q</button>
                <button id="W" onclick="keyClick(event)">W</button>
                <button id="E" onclick="keyClick(event)">E</button>
                <button id="R" onclick="keyClick(event)">R</button>
                <button id="T" onclick="keyClick(event)">T</button>
                <button id="Y" onclick="keyClick(event)">Y</button>
                <button id="U" onclick="keyClick(event)">U</button>
                <button id="I" onclick="keyClick(event)">I</button>
                <button id="O" onclick="keyClick(event)">O</button>
                <button id="P" onclick="keyClick(event)">P</button>
            </div>
            <div>
                <button id="A" onclick="keyClick(event)">A</button>
                <button id="S" onclick="keyClick(event)">S</button>
                <button id="D" onclick="keyClick(event)">D</button>
                <button id="F" onclick="keyClick(event)">F</button>
                <button id="G" onclick="keyClick(event)">G</button>
                <button id="H" onclick="keyClick(event)">H</button>
                <button id="J" onclick="keyClick(event)">J</button>
                <button id="K" onclick="keyClick(event)">K</button>
                <button id="L" onclick="keyClick(event)">L</button>
            </div>
            <div>
                <button id="Z" onclick="keyClick(event)">Z</button>
                <button id="X" onclick="keyClick(event)">X</button>
                <button id="C" onclick="keyClick(event)">C</button>
                <button id="V" onclick="keyClick(event)">V</button>
                <button id="B" onclick="keyClick(event)">B</button>
                <button id="N" onclick="keyClick(event)">N</button>
                <button id="M" onclick="keyClick(event)">M</button>
                <button id=" " onclick="keyClick(event)">__</button>
            </div>
        </div>
  
    </div>
    
    <script src="script.js"></script>
</body>
</html>
